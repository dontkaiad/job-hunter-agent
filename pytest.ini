[pytest]
testpaths = tests
addopts = -q
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
# A hung test (e.g. a DB lock wait) must fail fast, not stall CI. `thread` also
# works when the main thread is blocked inside libpq.
timeout = 60
timeout_method = thread
