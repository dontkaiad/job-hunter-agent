# ---------------------------------------------------------------------------
# job-hunter-agent — CANDIDATE PROFILE (example / fictional placeholder)
#
# This is a GENERIC, runnable example profile. It contains NO real person's
# data. The bot loads config/profile.local.yaml if it exists, otherwise it
# falls back to THIS file (see job_hunter/profile.py).
#
# To run the bot for yourself: copy this file to config/profile.local.yaml and
# fill in your own details. config/profile.local.yaml is gitignored and must
# NEVER be committed.
#
# Every field below is INJECTED into the LLM prompts at runtime (the scoring
# rubric profile block and the draft instructions). The judge/rubric logic and
# the honesty/gender RULES live in code (job_hunter/llm.py); the DATA lives
# here.
# ---------------------------------------------------------------------------

# Short role headline — what the candidate owns / does.
# FICTIONAL placeholder — replace with your own positioning in profile.local.yaml.
role: >-
  Example applied-LLM engineer who builds model-backed product features.
  Fictional placeholder — replace with your own positioning in
  profile.local.yaml.

# Target seniority grade and the grade rules.
target_grade: >-
  Example grade preference: open to a range of seniority levels; does NOT seek
  lead / people-management. A junior-titled role is acceptable ONLY if the
  salary is at/above the salary floor below.

# Short note on years / proof of skill (kept generic).
experience_note: >-
  Example note: a few years building software; evaluated on a public portfolio.

# HANDS-ON skills the candidate MAY claim as real, completed experience.
hands_on:
  - prompt design and iteration
  - retrieval-augmented generation over a vector store
  - structured output (validate -> retry -> fallback)
  - backend services exposing model-backed features

# IN-DEVELOPMENT items — being learned / built toward, NOT yet hands-on.
# These must NEVER be presented as completed experience in drafts.
in_development:
  - example in-progress skill (being learned, not yet hands-on)

# NEVER-CLAIM items — things the candidate does NOT do. Injected into the scoring
# profile block and the draft prompt so they are never presented as experience.
# Empty by default; set your own in profile.local.yaml.
never_claim: []

# Tech stack. Plain list of tools the candidate uses.
stack:
  - Python
  - an LLM API (Claude / OpenAI / Gemini)
  - a vector database
  - FastAPI
  - SQL
  - Docker

# Languages note (free text; mention current speaking/writing level honestly).
languages: >-
  Example languages note — e.g. English at a working level.

# LOCATION PRIORITY ladder (highest -> lowest preference). Free-text lines.
location_priority:
  - A company offering relocation / work abroad -> top.
  - Fully remote -> high.
  - Hybrid -> medium.
  - Office in home city -> low.

# Grammatical gender used for first-person self-reference in drafts.
# Allowed: "female" (feminine Russian forms), "male" (masculine forms),
# or "unspecified" (neutral / avoid gendered self-reference).
gender: unspecified

# Hard salary floor, EUR per month (gross). A junior role is acceptable only
# at/above this; postings whose salary top is below it are hard-rejected.
# This is a GENERIC placeholder — set your own in profile.local.yaml.
salary_floor_eur: 1000

# Draft signature appended verbatim to every generated отклик.
draft_signature:
  # GitHub / portfolio URL shown as proof of skill (no scheme prefix).
  github: github.com/example
  # The second signature line, appended as is under the GitHub line: a personal site ("Site: example.test") or a
  # resume reference (a literal PLACEHOLDER the operator swaps at send time). Never a fabricated real URL.
  resume: "[resume: link]"

# The fixed intro of every draft is built by code, right under the greeting: "<application sentence> <this sentence>".
# The application sentence is generic ("I'm applying for the <role> position."); this one says who the candidate is
# (put the years of experience here, in the private profile only). One sentence per language.
draft_intro:
  ru: "Я инженер, работаю с ИИ."
  en: "I'm an engineer working with AI."

# --- Candidate-specific scoring wording (all OPTIONAL; generic defaults live in job_hunter/llm.py) ---
# Keep your real wording in config/profile.local.yaml (gitignored). The public code carries none of it.
#
# score_location_rubric: a multi-line rubric paragraph that ranks locations / employer markets for
#   the v1 scoring prompt (v2 does not score location). Omit it to use the generic sentence.
# score_low_fit_extra: extra "low score" items appended to the rubric's LOW / REJECT-WORTHY list.
# calibration_anchors / calibration_anchors_v2: four numeric anchor lines (~10 / ~42 / ~65 / ~88).
#   "{floor}" is replaced by salary_floor_eur. v2 anchors carry no location wording.
score_low_fit_extra:
  - "an interview format the candidate cannot pass (example placeholder)"

# Market benchmark chips shown in the dashboard sidebar (OPTIONAL, private: keep real figures in
# profile.local.yaml). Empty / absent = no chips. Example shape:
# market_benchmarks:
#   - {label: "home market", value: "X–Y", note: "optional line under the figure"}
#   - {label: "international", value: "X–Y"}
# The market page's "Ориентир по рынку" block is shown ONLY when this list is non-empty; its caption
# and source chips come from the two keys below (both optional).
market_benchmarks: []
market_benchmark_subtitle: ""
market_benchmark_sources: []
